name: Workifind CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Validate: runs on every push and PR. Gates the deploy job below.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_CLERK_SIGN_UP_FALLBACK_URL: /
      NEXT_CLERK_SIGN_IN_FALLBACK_URL: /
      # File uploads. Neither is read during `next build` — the upload and
      # download routes are `force-dynamic` and resolve these per request — but
      # this block is the list of what the app needs, and one that omits half of
      # it stops being worth reading.
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install Dependencies
        # `npm ci` is reproducible and fails on an out-of-sync lockfile.
        # (postinstall runs `prisma generate`.)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check & Build
        # `next build` type-checks and validates the Prisma schema.
        run: npm run build

  # ---------------------------------------------------------------------------
  # Deploy: only on push to main, and only after validate passes.
  # ---------------------------------------------------------------------------
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_CLERK_SIGN_UP_FALLBACK_URL: /
      NEXT_CLERK_SIGN_IN_FALLBACK_URL: /
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
      # Link the Vercel CLI to the right project without an interactive login.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # The Vercel project itself holds no environment variables: GitHub secrets
    # are the single source of truth, and the deploy step below hands them to
    # Vercel per deployment (`--build-env` for `next build`, `--env` for the
    # running functions). Both halves are needed — the build prerenders job and
    # company pages against Postgres and mounts ClerkProvider, and the deployed
    # functions read the same values again on every request.
    #
    # The cost of that choice: a deployment triggered from anywhere other than
    # this workflow — a dashboard redeploy, Vercel's own git integration, a
    # preview build — gets an empty environment and fails. Adding a variable
    # means adding it to `deploy_vars` below, not just to the dashboard.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Database Migrations
        # Applies committed migrations to the production database (replaces the
        # old `prisma db push` in the build script). NOTE: the existing DB must
        # be baselined once before the first run:
        #   npx prisma migrate resolve --applied 0_init
        run: npx prisma migrate deploy

      - name: Install Vercel CLI
        # Use the official CLI directly; the previous amondnet/vercel-action
        # bundled an outdated CLI that Vercel's API now rejects.
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        # Every variable the app needs, passed twice: `--build-env` reaches
        # `next build` in Vercel's build container, `--env` reaches the
        # functions at request time. Values come from the job environment
        # above, so a secret is named here once rather than pasted twice.
        run: |
          deploy_vars=(
            NEXT_PUBLIC_API_BASE_URL
            POSTGRES_URL
            POSTGRES_URL_NON_POOLING
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            NEXT_PUBLIC_CLERK_SIGN_UP_URL
            NEXT_PUBLIC_CLERK_SIGN_IN_URL
            NEXT_CLERK_SIGN_UP_FALLBACK_URL
            NEXT_CLERK_SIGN_IN_FALLBACK_URL
            BLOB_READ_WRITE_TOKEN
            UPLOAD_SIGNING_SECRET
          )

          # An unset secret would otherwise deploy as an empty string and fail
          # in production instead of here.
          missing=()
          for name in "${deploy_vars[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

          flags=()
          for name in "${deploy_vars[@]}"; do
            flags+=(--build-env "$name=${!name}" --env "$name=${!name}")
          done

          vercel deploy --prod --yes --token="$VERCEL_TOKEN" "${flags[@]}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
